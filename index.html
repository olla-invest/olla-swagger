<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olla API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; }

    /* 사이드바 */
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 220px;
      height: 100vh;
      background: #1a1a2e;
      overflow-y: auto;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      padding-bottom: 20px;
    }
    #sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid #2e2e4a;
    }
    #sidebar-header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    #sidebar-header p {
      margin: 4px 0 0;
      font-size: 11px;
      color: #6b6b8a;
    }
    #sidebar-nav {
      padding: 10px 0;
      flex: 1;
    }
    .nav-group-label {
      padding: 10px 16px 4px;
      font-size: 10px;
      font-weight: 600;
      color: #5a5a7a;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 12.5px;
      color: #a0a0c0;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
      text-decoration: none;
      user-select: none;
    }
    .nav-item:hover {
      background: #22224a;
      color: #ffffff;
      border-left-color: #4a90d9;
    }
    .nav-item.active {
      background: #1e2d4a;
      color: #ffffff;
      border-left-color: #4a90d9;
    }
    .nav-item .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 태그별 색상 */
    .dot-auth       { background: #e57373; }
    .dot-mypage     { background: #81c784; }
    .dot-watchlist  { background: #64b5f6; }
    .dot-realtime   { background: #ffb74d; }
    .dot-stock      { background: #ce93d8; }
    .dot-theme      { background: #4db6ac; }
    .dot-default    { background: #90a4ae; }

    /* 메인 컨텐츠 */
    #main {
      margin-left: 220px;
      flex: 1;
      min-width: 0;
    }
    #swagger-ui { width: 100%; }

    /* Swagger UI 상단 topbar 숨기기 (선택) */
    .topbar { display: none !important; }

    /* Read-only docs: hide live request controls/results */
    .try-out,
    .execute-wrapper,
    .curl-command,
    .request-url,
    .live-responses-table {
      display: none !important;
    }

    /* 스크롤바 */
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-track { background: transparent; }
    #sidebar::-webkit-scrollbar-thumb { background: #2e2e4a; border-radius: 2px; }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>🦙 Olla API</h1>
      <p>API Documentation</p>
    </div>
    <div id="sidebar-nav">
      <div class="nav-group-label">Index</div>
      <!-- JS에서 동적으로 채움 -->
    </div>
  </nav>

  <!-- Swagger UI -->
  <div id="main">
    <div id="swagger-ui"></div>
  </div>

  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script>
    const API_SERVER_URL = 'https://ballot-pack-donations-exposure.trycloudflare.com';

    // 태그 → 색상 dot 매핑
    function getDotClass(tag) {
      if (tag.includes('인증') || tag.includes('Auth')) return 'dot-auth';
      if (tag.includes('마이페이지')) return 'dot-mypage';
      if (tag.includes('관심종목') || tag.includes('Watchlist')) return 'dot-watchlist';
      if (tag.includes('실시간') || tag.includes('Real')) return 'dot-realtime';
      if (tag.includes('종목') || tag.includes('Stock') || tag.includes('이슈') || tag.includes('Issue')) return 'dot-stock';
      if (tag.includes('테마') || tag.includes('Theme')) return 'dot-theme';
      return 'dot-default';
    }

    // 태그 섹션으로 스크롤 + 펼치기
    function scrollToTag(tagName) {
      // data-tag 속성으로 찾기
      let target = document.querySelector(`.opblock-tag[data-tag="${tagName}"]`);

      // fallback: 텍스트 내용으로 찾기
      if (!target) {
        document.querySelectorAll('.opblock-tag').forEach(el => {
          if (el.textContent.trim().startsWith(tagName.replace(/ *\(.*\)/, '').trim())) {
            target = el;
          }
        });
      }

      if (!target) return;

      // 닫혀 있으면 먼저 열기
      const section = target.closest('.opblock-tag-section') || target.parentElement;
      const isClosed = section && section.classList.contains('is-open') === false;
      if (isClosed) target.click();

      // 열린 후 스크롤 (offset: 20px 여유)
      setTimeout(() => {
        const top = target.getBoundingClientRect().top + window.pageYOffset - 72;
        window.scrollTo({ top, behavior: 'smooth' });
      }, isClosed ? 150 : 0);
    }

    // 사이드바 nav 아이템 생성
    function buildSidebar(tags) {
      const nav = document.getElementById('sidebar-nav');
      nav.innerHTML = '<div class="nav-group-label">Index</div>';
      tags.forEach(tag => {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.innerHTML = `<span class="dot ${getDotClass(tag)}"></span>${tag}`;
        item.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          scrollToTag(tag);
        });
        nav.appendChild(item);
      });
    }

    // window 스크롤 감지로 활성 항목 업데이트
    function updateActiveOnScroll(tags) {
      window.addEventListener('scroll', () => {
        let currentTag = null;
        document.querySelectorAll('.opblock-tag[data-tag]').forEach(btn => {
          const rect = btn.getBoundingClientRect();
          if (rect.top <= 60) currentTag = btn.getAttribute('data-tag');
        });
        if (!currentTag) return;
        document.querySelectorAll('.nav-item').forEach(el => {
          el.classList.toggle('active', el.textContent.trim() === currentTag);
        });
      }, { passive: true });
    }

    // Swagger UI 초기화
    function resolveSchemaRef(spec, schema) {
      if (!schema || typeof schema !== 'object' || !schema.$ref) return schema;

      const path = schema.$ref.replace(/^#\//, '').split('/');
      return path.reduce((current, key) => {
        if (!current) return undefined;
        return current[key];
      }, spec);
    }

    function buildExampleFromSchema(spec, schema, seen = new Set()) {
      if (schema && typeof schema === 'object' && schema.$ref) {
        if (seen.has(schema.$ref)) return null;
        seen.add(schema.$ref);
      }

      const resolved = resolveSchemaRef(spec, schema);
      if (!resolved || typeof resolved !== 'object') return null;

      if (resolved.example !== undefined) return resolved.example;
      if (resolved.default !== undefined) return resolved.default;

      if (resolved.allOf) {
        return resolved.allOf.reduce((example, item) => {
          const itemExample = buildExampleFromSchema(spec, item, seen);
          return typeof itemExample === 'object' && !Array.isArray(itemExample)
            ? { ...example, ...itemExample }
            : example;
        }, {});
      }

      if (resolved.oneOf || resolved.anyOf) {
        return buildExampleFromSchema(spec, (resolved.oneOf || resolved.anyOf)[0], seen);
      }

      if (resolved.type === 'array') {
        return [buildExampleFromSchema(spec, resolved.items, seen)];
      }

      if (resolved.type === 'object' || resolved.properties) {
        return Object.entries(resolved.properties || {}).reduce((example, [key, value]) => {
          example[key] = buildExampleFromSchema(spec, value, seen);
          return example;
        }, {});
      }

      if (resolved.enum && resolved.enum.length) return resolved.enum[0];

      switch (resolved.type) {
        case 'integer':
        case 'number':
          return 0;
        case 'boolean':
          return true;
        case 'string':
          if (resolved.format === 'date-time') return '2026-05-23T00:00:00.000Z';
          if (resolved.format === 'date') return '2026-05-23';
          return 'string';
        default:
          return null;
      }
    }

    function normalizeOpenApiResponses(spec) {
      const servers = Array.isArray(spec.servers) ? spec.servers : [];
      spec.servers = [
        {
          url: API_SERVER_URL,
          description: 'Public backend'
        },
        ...servers.filter(server => server && server.url !== API_SERVER_URL)
      ];

      Object.values(spec.paths || {}).forEach(methods => {
        Object.values(methods || {}).forEach(op => {
          Object.values(op.responses || {}).forEach(response => {
            if (!response.description) response.description = 'JSON response';

            const content = response.content || {};
            const jsonMedia = content['application/json'];
            const jsonSchema = jsonMedia && jsonMedia.schema;

            if (jsonSchema) {
              if (jsonSchema.type === 'object' && !jsonSchema.properties) {
                const message = jsonSchema.example && jsonSchema.example.message
                  ? jsonSchema.example.message
                  : response.description;
                jsonSchema.properties = {
                  message: {
                    type: 'string',
                    example: message
                  }
                };
                jsonSchema.required = jsonSchema.required || ['message'];
              }

              jsonMedia.example = jsonMedia.example || jsonSchema.example || buildExampleFromSchema(spec, jsonSchema) || {
                message: response.description
              };
              return;
            }

            response.content = {
              ...content,
              'application/json': {
                schema: {
                  type: 'object',
                  properties: {
                    message: {
                      type: 'string',
                      example: response.description
                    }
                  },
                  required: ['message'],
                  additionalProperties: true
                },
                example: {
                  message: response.description
                }
              }
            };
          });
        });
      });

      return spec;
    }

    fetch(`./swagger.json?v=${Date.now()}`)
      .then(r => r.json())
      .then(spec => {
        spec = normalizeOpenApiResponses(spec);

        // tags 추출 (paths에서)
        const tagSet = new Set();
        Object.values(spec.paths || {}).forEach(methods =>
          Object.values(methods).forEach(op => (op.tags || []).forEach(t => tagSet.add(t)))
        );
        const tags = [...tagSet];

        SwaggerUIBundle({
          spec,
          dom_id: '#swagger-ui',
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
          plugins: [
            function DisableExecutePlugin() {
              return {
                statePlugins: {
                  spec: {
                    wrapActions: {
                      executeRequest: () => () => null
                    }
                  }
                }
              };
            }
          ],
          layout: 'BaseLayout',
          deepLinking: true,
          docExpansion: 'list',
          supportedSubmitMethods: [],
          defaultModelRendering: 'model',
          requestInterceptor: request => {
            if (request.url && request.url.startsWith(window.location.origin)) {
              request.url = request.url.replace(window.location.origin, API_SERVER_URL);
            }
            return request;
          },
          onComplete: () => {
            buildSidebar(tags);
            updateActiveOnScroll(tags);
          }
        });
      });
  </script>
</body>
</html>
